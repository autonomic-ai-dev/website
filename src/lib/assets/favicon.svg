<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="28" fill="#000000"/>
  <rect x="0.5" y="0.5" width="119" height="119" rx="27.5" stroke="#27272A" stroke-width="1"/>
  
  <!-- Isometric Cognitive Governor Prism -->
  <polygon points="60,28 88,44 60,60 32,44" fill="url(#topGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="32,44 60,60 60,92 32,76" fill="url(#leftGrad)" stroke="#E4E4E7" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="60,60 88,44 88,76 60,92" fill="url(#rightGrad)" stroke="#D4D4D8" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Neural Core / Governor Hub -->
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="10" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 2"/>

  <defs>
    <linearGradient id="topGrad" x1="32" y1="28" x2="88" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="32" y1="44" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71717A"/>
      <stop offset="1" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="88" y1="44" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#52525B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
  </defs>
</svg>