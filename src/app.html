<!doctype html>
<html lang="en" class="dark scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Autonomic AI — Autonomous AI Agent Engineering OS</title>
		<!-- Google Fonts & Material Symbols -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
		<style>
			.material-symbols-outlined {
				font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
				display: inline-block;
				vertical-align: middle;
				line-height: 1;
			}
			:not(pre) > code {
				background-color: rgba(6, 182, 212, 0.12) !important;
				color: #22d3ee !important;
				padding: 0.125em 0.375em !important;
				border-radius: 0.375rem !important;
				font-size: 0.875em !important;
				font-weight: 500 !important;
				font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
			}
			/* Remove Tailwind Typography backtick pseudo-elements that show raw ` around inline code */
			.prose :where(code):not(:where([class~="not-prose"] *))::before,
			.prose :where(code):not(:where([class~="not-prose"] *))::after {
				content: none !important;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#0a0a0c] text-slate-100 font-body selection:bg-cyan-500/30 selection:text-cyan-200 antialiased relative min-h-screen overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
