<!doctype html>
<html lang="en" class="dark scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/logo.svg" type="image/svg+xml" />
		<!-- Google Fonts & Material Symbols -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
		<style>
			.material-symbols-outlined {
				font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
				display: inline-block;
				vertical-align: middle;
				line-height: 1;
			}
			:not(pre) > code {
				background: none !important;
				color: inherit !important;
				padding: 0 !important;
				border: 0 !important;
				font-size: inherit !important;
				font-weight: inherit !important;
				font-family: inherit !important;
			}
			/* Remove Tailwind Typography backtick pseudo-elements that show raw ` around inline code */
			.prose :where(code):not(:where([class~="not-prose"] *))::before,
			.prose :where(code):not(:where([class~="not-prose"] *))::after {
				content: none !important;
			}
		</style>
		%sveltekit.head%
		<script defer src="/_vercel/insights/script.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-black text-neutral-100 font-body selection:bg-neutral-800 selection:text-white antialiased relative min-h-screen overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
